<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06120B" />
      <stop offset="50%" stop-color="#0A1D13" />
      <stop offset="100%" stop-color="#0D2A1C" />
    </linearGradient>
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.3" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.06" stroke="#4ADE80" stroke-width="0.8">
    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="200" x2="900" y2="200" />
    <line x1="100" y1="0" x2="100" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="300" y1="0" x2="300" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="500" y1="0" x2="500" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="700" y1="0" x2="700" y2="240" />
    <line x1="800" y1="0" x2="800" y2="240" />
  </g>

  <!-- Logo Icon Container (Glow effect) -->
  <g transform="translate(60, 40)">
    <!-- Ambient Glow -->
    <circle cx="80" cy="80" r="65" fill="#10B981" opacity="0.08" filter="url(#glow)" />
    <rect x="15" y="15" width="130" height="130" rx="28" fill="#0E2318" stroke="#34D399" stroke-width="1.8" stroke-opacity="0.4" />
    
    <!-- TerraMind Neural Tree Icon -->
    <g transform="translate(30, 30) scale(1.0)" stroke="url(#neuralGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Left Hemisphere Arc -->
      <path d="M 50 12 A 38 38 0 0 0 50 88" />
      
      <!-- Top Branch -->
      <path d="M 23 23 Q 40 23 50 34 L 60 34 L 70 24 L 78 24" />
      <circle cx="78" cy="24" r="3.6" fill="#34D399" stroke="#064E3B" stroke-width="1" />
      
      <!-- Upper Middle Branch -->
      <path d="M 14 38 Q 36 38 46 50 L 56 50 L 64 42 L 82 42" />
      <circle cx="82" cy="42" r="3.6" fill="#34D399" stroke="#064E3B" stroke-width="1" />
      
      <!-- Lower Middle Branch -->
      <path d="M 12 55 Q 32 55 42 66 L 52 66 L 60 58 L 78 58" />
      <circle cx="78" cy="58" r="3.6" fill="#34D399" stroke="#064E3B" stroke-width="1" />
      
      <!-- Bottom Branch -->
      <path d="M 18 72 Q 28 72 38 80 L 48 80 L 56 72 L 68 72" />
      <circle cx="68" cy="72" r="3.6" fill="#34D399" stroke="#064E3B" stroke-width="1" />
    </g>
  </g>

  <!-- Typography & Information -->
  <g transform="translate(250, 68)">
    <!-- Brand Title -->
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="url(#textGrad)">
      TerraMind
    </text>

    <!-- Version & Tag -->
    <rect x="235" y="12" width="68" height="24" rx="12" fill="#10B981" fill-opacity="0.2" stroke="#34D399" stroke-width="1" />
    <text x="269" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">v1.2.0</text>

    <!-- Tagline -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#34D399">
      Otonom Zirai Karar Destek Sistemi (DSS) &amp; Canlı CBS Parsel Ekosistemi
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
      IoT Telemetri Enterpolasyonu (IDW) • Kadastral TKGM Uydu Entegrasyonu • Kriz Laboratuvarı &amp; MRV Karbon Doğrulama
    </text>
  </g>

  <!-- Status Indicator in Top Right -->
  <g transform="translate(740, 28)">
    <rect width="130" height="28" rx="14" fill="#062215" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="14" r="5" fill="#10B981" />
    <circle cx="16" cy="14" r="8" fill="#10B981" opacity="0.3" />
    <text x="70" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#A7F3D0" text-anchor="middle">SİSTEM AKTİF</text>
  </g>
</svg>
